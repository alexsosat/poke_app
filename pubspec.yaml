name: poke_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  auto_route: ^11.1.0
  dio: ^5.11.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_common_classes:
    git:
      url: https://github.com/alexsosat/flutter_common_classes.git
      ref: 1.1.4
  flutter_bloc: ^9.1.1
  flutter_flavor: ^3.1.4
  flutter_pretty_dio_logger: ^3.0.0
  fpdart: ^1.2.0
  get_it: ^9.2.1
  google_fonts: ^8.2.0
  internet_connection_checker_plus: ^2.7.2
  shimmer: ^3.0.0
  device_preview_minus: ^1.4.0
  flutter_debouncer: ^2.1.1
  cached_network_image: ^3.4.1
  percent_indicator: ^4.2.5

dev_dependencies:
  build_runner: ^2.15.1
  auto_route_generator: ^10.6.0
  flutter_gen_runner: ^5.14.1
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/

flutter_gen:
  output: lib/core/gen
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  remove_alpha_ios: true